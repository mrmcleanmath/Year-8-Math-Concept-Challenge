
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Year 8 Math Concept Challenge</title>
<style>
:root{
  --bg:#eef3fb;
  --panel:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#d9e2ef;
  --accent:#2f67d8;
  --accent-dark:#214da9;
  --accent-soft:#eaf1ff;
  --good:#16a34a;
  --good-dark:#0f7a37;
  --good-soft:#dcfce7;
  --bad:#dc2626;
  --bad-soft:#fee2e2;
  --shadow:0 18px 44px rgba(31,41,55,.11);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 2%,rgba(47,103,216,.12),transparent 26rem),
    radial-gradient(circle at 92% 12%,rgba(80,119,211,.08),transparent 22rem),
    linear-gradient(180deg,#f7f9fd 0%,var(--bg) 100%);
}
button{font:inherit}
button:focus-visible{outline:3px solid rgba(47,103,216,.34);outline-offset:3px}
.app{
  width:min(1000px,94vw);
  margin:0 auto;
  padding:24px 0 42px;
}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
}
.title-wrap{min-width:0}
h1{
  margin:0;
  font-size:clamp(1.7rem,3.2vw,2.5rem);
  line-height:1.02;
  letter-spacing:-.04em;
}
.subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:.95rem;
}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.small-btn{
  min-height:42px;
  padding:9px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  color:#334155;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 14px rgba(31,41,55,.05);
  transition:transform .14s ease,background .14s ease,border-color .14s ease;
}
.small-btn:hover{transform:translateY(-1px);background:#f8fafc;border-color:#c8d5e7}
.section-strip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:13px 15px;
  margin-bottom:14px;
  border:1px solid #d8e4f6;
  border-radius:15px;
  background:linear-gradient(135deg,#f5f8ff,#edf3ff);
}
.section-name{font-weight:900;color:#284b88}
.section-sv{margin-top:3px;color:#62718a;font-size:.82rem;font-weight:700}
.round-chip{
  flex:0 0 auto;
  padding:7px 10px;
  border-radius:999px;
  background:#fff;
  border:1px solid #d7e1ef;
  color:#4d5f79;
  font-size:.76rem;
  font-weight:850;
}
.hud{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:16px;
  margin-bottom:10px;
}
.progress-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:7px;
  color:#5e6d82;
  font-size:.84rem;
  font-weight:800;
}
.progress-track{
  height:9px;
  border-radius:999px;
  background:#dfe6f0;
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(31,41,55,.08);
}
.progress-fill{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,#2f67d8,#5f86e4);
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}
.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.stat{
  min-width:80px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(255,255,255,.88);
  text-align:center;
  box-shadow:0 5px 14px rgba(31,41,55,.05);
}
.stat-value{font-size:1.08rem;font-weight:950;line-height:1;color:#263a5a}
.stat-label{margin-top:4px;color:#718096;font-size:.66rem;font-weight:850;letter-spacing:.05em;text-transform:uppercase}
.quiz-shell{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow);
}
.quiz-shell::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:4px;
  background:linear-gradient(90deg,#2f67d8,#7f9ee8,#2f67d8);
  background-size:180% 100%;
  animation:headerFlow 5s linear infinite;
}
@keyframes headerFlow{to{background-position:180% 0}}
.quiz-inner{padding:clamp(22px,4vw,42px)}
.question-kicker{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}
.kicker-text{
  color:var(--accent);
  font-size:.76rem;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.question-badge{
  padding:6px 9px;
  border-radius:9px;
  background:var(--accent-soft);
  color:#34578e;
  font-size:.72rem;
  font-weight:900;
}
.question-block{
  padding:2px 0 7px;
  text-align:center;
}
.question-en{
  margin:0;
  font-size:clamp(1.35rem,3vw,2rem);
  line-height:1.22;
  letter-spacing:-.025em;
  font-weight:900;
  color:#1f2c42;
}
.translation-divider{
  width:54px;
  height:2px;
  margin:13px auto 12px;
  border-radius:999px;
  background:#d8e3f4;
}
.question-sv{
  margin:0 auto;
  max-width:800px;
  color:#66758a;
  font-size:clamp(.98rem,2vw,1.17rem);
  line-height:1.35;
  font-weight:700;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:28px;
}
.option{
  position:relative;
  width:100%;
  min-height:108px;
  overflow:hidden;
  display:flex;
  align-items:flex-start;
  gap:13px;
  padding:15px 16px;
  border:1px solid #d7e1ee;
  border-radius:16px;
  background:linear-gradient(180deg,#ffffff,#f7f9fc);
  color:#26344c;
  text-align:left;
  cursor:pointer;
  box-shadow:0 7px 16px rgba(31,41,55,.055);
  transition:transform .16s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease,filter .18s ease;
}
.option:hover:not(:disabled){
  transform:translateY(-2px);
  border-color:#acc0e4;
  background:linear-gradient(180deg,#fff,#f1f5ff);
  box-shadow:0 10px 20px rgba(47,103,216,.10);
}
.option:disabled{cursor:default}
.option-letter{
  width:31px;
  height:31px;
  flex:0 0 31px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#e8eef8;
  color:#375b91;
  font-size:.82rem;
  font-weight:950;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.option-copy{min-width:0;padding-top:1px}
.option-en{font-size:.94rem;line-height:1.28;font-weight:850;color:#26344c}
.option-sv{margin-top:6px;font-size:.79rem;line-height:1.3;font-weight:650;color:#718096}
.option.correct{
  border-color:rgba(22,163,74,.62);
  background:linear-gradient(135deg,#f5fff8,#dcfce7);
  box-shadow:0 0 0 3px rgba(22,163,74,.10),0 14px 30px rgba(22,163,74,.18);
  animation:correctLift .62s cubic-bezier(.2,.8,.2,1);
}
.option.correct::after{
  content:"";
  position:absolute;
  inset:-40%;
  background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.75) 49%,transparent 58%);
  transform:translateX(-75%) rotate(5deg);
  animation:shine .68s ease-out forwards;
  pointer-events:none;
}
.option.correct .option-letter{background:var(--good);color:#fff;transform:scale(1.08)}
.option.correct .option-en{color:#14532d}
.option.correct .option-sv{color:#35724b}
@keyframes correctLift{
  0%{transform:scale(1)}
  38%{transform:scale(1.025)}
  100%{transform:scale(1)}
}
@keyframes shine{to{transform:translateX(75%) rotate(5deg)}}
.option.wrong{
  border-color:rgba(220,38,38,.48);
  background:linear-gradient(135deg,#fff8f8,#fee2e2);
  box-shadow:0 0 0 3px rgba(220,38,38,.07);
  animation:wrongShake .38s ease;
}
.option.wrong .option-letter{background:var(--bad);color:#fff}
.option.wrong .option-en{color:#8f1d1d}
.option.wrong .option-sv{color:#a64a4a}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
}
.feedback-wrap{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:18px;
}
.feedback{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:44px;
  padding:9px 14px;
  border-radius:14px;
  font-weight:900;
  opacity:0;
  transform:translateY(4px) scale(.98);
  transition:opacity .18s ease,transform .18s ease;
}
.feedback.show{opacity:1;transform:translateY(0) scale(1)}
.feedback.good{color:var(--good-dark);background:#ecfdf3;border:1px solid #bceccf}
.feedback.bad{color:#b42318;background:#fff3f2;border:1px solid #ffd0cc}
.feedback-icon{
  width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  font-size:.86rem;font-weight:950;color:#fff;
}
.feedback.good .feedback-icon{background:var(--good)}
.feedback.bad .feedback-icon{background:var(--bad)}
.feedback-copy{line-height:1.1}
.feedback-sv{display:block;margin-top:3px;font-size:.74rem;font-weight:800;opacity:.78}
.celebration-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{
  position:absolute;
  left:50%;
  top:52%;
  width:8px;
  height:8px;
  border-radius:2px;
  opacity:0;
  background:var(--good);
  animation:sparkBurst .72s ease-out forwards;
}
@keyframes sparkBurst{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(.6)}
  75%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1.05)}
}
.completion{
  display:none;
  text-align:center;
  padding:8px 0 3px;
}
.completion.show{display:block;animation:completionIn .42s ease both}
@keyframes completionIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.trophy{
  width:76px;
  height:76px;
  display:grid;
  place-items:center;
  margin:0 auto 13px;
  border-radius:24px;
  background:linear-gradient(145deg,#edf3ff,#dfe9ff);
  border:1px solid #cfdcf4;
  color:var(--accent);
  font-size:2.1rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px rgba(47,103,216,.10);
}
.completion h2{margin:0;font-size:clamp(1.65rem,3vw,2.1rem);letter-spacing:-.025em}
.completion p{margin:8px auto 22px;max-width:570px;color:var(--muted);line-height:1.45}
.results{
  width:min(520px,100%);
  margin:0 auto 22px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.result-box{
  padding:15px 10px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#f8fafc;
}
.result-value{font-size:1.5rem;font-weight:950;line-height:1;color:#263a5a}
.result-label{margin-top:6px;color:#768398;font-size:.68rem;font-weight:850;letter-spacing:.04em;text-transform:uppercase}
.result-box.wrong .result-value{color:var(--bad)}
.primary-btn{
  min-height:46px;
  padding:11px 17px;
  border:0;
  border-radius:13px;
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));
  color:#fff;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 9px 20px rgba(47,103,216,.24);
  transition:transform .15s ease,box-shadow .15s ease;
}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(47,103,216,.28)}
@media (max-width:760px){
  .topbar{align-items:flex-start}
  .hud{grid-template-columns:1fr}
  .stats{justify-content:flex-start}
  .options{grid-template-columns:1fr}
  .option{min-height:92px}
}
@media (max-width:500px){
  .app{width:min(94vw,100%);padding-top:16px}
  .topbar{display:block}
  .top-actions{justify-content:flex-start;margin-top:12px}
  .section-strip{align-items:flex-start;flex-direction:column}
  .round-chip{align-self:flex-start}
  .quiz-shell{border-radius:18px}
  .quiz-inner{padding:20px 15px 22px}
  .question-kicker{align-items:flex-start}
  .question-badge{white-space:nowrap}
  .options{gap:10px;margin-top:22px}
  .option{padding:13px 12px;min-height:88px}
  .option-en{font-size:.9rem}
  .option-sv{font-size:.76rem}
  .results{grid-template-columns:1fr 1fr}
  .result-box:last-child{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="title-wrap">
      <h1>Year 8 Math Concept Challenge</h1>
      <p class="subtitle">Choose the correct answer.</p>
    </div>
    <div class="top-actions">
      <button class="small-btn" id="newRoundBtn" type="button">New Round</button>
    </div>
  </header>

  <section class="section-strip" aria-label="Current section">
    <div>
      <div class="section-name">Chapter 1.1 • Calculations with fractions</div>
      <div class="section-sv">Kapitel 1.1 • Beräkningar med bråk</div>
    </div>
    <div class="round-chip">10 random questions</div>
  </section>

  <section class="hud" aria-label="Game progress">
    <div>
      <div class="progress-meta">
        <span id="progressText">Question 1 of 10</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-value" id="completedStat">0</div><div class="stat-label">Completed</div></div>
      <div class="stat"><div class="stat-value" id="streakStat">0</div><div class="stat-label">Streak</div></div>
      <div class="stat"><div class="stat-value" id="wrongStat">0</div><div class="stat-label">Mistakes</div></div>
    </div>
  </section>

  <section class="quiz-shell" id="quizShell">
    <div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div>
    <div class="quiz-inner">
      <div id="questionView">
        <div class="question-kicker">
          <div class="kicker-text">Concept Challenge</div>
          <div class="question-badge" id="questionBadge">1 / 10</div>
        </div>

        <div class="question-block">
          <h2 class="question-en" id="questionEn"></h2>
          <div class="translation-divider"></div>
          <p class="question-sv" id="questionSv" lang="sv"></p>
        </div>

        <div class="options" id="options"></div>

        <div class="feedback-wrap" aria-live="polite">
          <div class="feedback" id="feedback">
            <span class="feedback-icon" id="feedbackIcon"></span>
            <span class="feedback-copy" id="feedbackCopy"></span>
          </div>
        </div>
      </div>

      <div class="completion" id="completion">
        <div class="trophy" aria-hidden="true">★</div>
        <h2>Round complete!</h2>
        <p id="completionMessage"></p>
        <div class="results">
          <div class="result-box">
            <div class="result-value" id="resultCompleted">10</div>
            <div class="result-label">Questions</div>
          </div>
          <div class="result-box wrong">
            <div class="result-value" id="resultWrong">0</div>
            <div class="result-label">Wrong attempts</div>
          </div>
          <div class="result-box">
            <div class="result-value" id="resultStreak">0</div>
            <div class="result-label">Best streak</div>
          </div>
        </div>
        <button class="primary-btn" id="playAgainBtn" type="button">Play a New Round</button>
      </div>
    </div>
  </section>
</main>

<script>
const QUESTION_BANK = [
  {
    en:"In a fraction, what does the denominator (bottom number) represent?",
    sv:"Vad representerar nämnaren (talet längst ner) i ett bråk?",
    correct:{en:"The total number of equal parts the whole is divided into.",sv:"Det totala antalet lika stora delar som helheten är indelad i."},
    wrong:[
      {en:"The number of equal parts being considered.",sv:"Antalet lika stora delar som avses."},
      {en:"The number of whole numbers in the fraction.",sv:"Antalet heltal i bråket."},
      {en:"The number you add to the numerator.",sv:"Talet som du adderar till täljaren."}
    ]
  },
  {
    en:"In a fraction, what does the numerator (top number) represent?",
    sv:"Vad representerar täljaren (talet längst upp) i ett bråk?",
    correct:{en:"The number of equal parts being considered.",sv:"Antalet lika stora delar som avses."},
    wrong:[
      {en:"The total number of equal parts the whole is divided into.",sv:"Det totala antalet lika stora delar som helheten är indelad i."},
      {en:"The number of whole numbers in the fraction.",sv:"Antalet heltal i bråket."},
      {en:"The number that tells you the size of the denominator.",sv:"Talet som anger nämnarens storlek."}
    ]
  },
  {
    en:"What is a mixed number?",
    sv:"Vad är ett tal i blandad form?",
    correct:{en:"A number made up of a whole number and a proper fraction.",sv:"Ett tal som består av ett heltal och ett äkta bråk."},
    wrong:[
      {en:"A fraction whose numerator is greater than its denominator.",sv:"Ett bråk där täljaren är större än nämnaren."},
      {en:"A fraction whose numerator and denominator are equal.",sv:"Ett bråk där täljaren och nämnaren är lika stora."},
      {en:"A number made up of a decimal and a fraction.",sv:"Ett tal som består av ett decimaltal och ett bråk."}
    ]
  },
  {
    en:"What is an improper fraction?",
    sv:"Vad är ett oäkta bråk?",
    correct:{en:"A fraction in which the numerator is greater than or equal to the denominator.",sv:"Ett bråk där täljaren är större än eller lika med nämnaren."},
    wrong:[
      {en:"A fraction in which the numerator is smaller than the denominator.",sv:"Ett bråk där täljaren är mindre än nämnaren."},
      {en:"A fraction that has already been simplified.",sv:"Ett bråk som redan har förenklats."},
      {en:"A fraction with two different denominators.",sv:"Ett bråk med två olika nämnare."}
    ]
  },
  {
    en:"What does it mean to simplify a fraction?",
    sv:"Vad betyder det att förenkla ett bråk?",
    correct:{en:"To write an equivalent fraction in its simplest form.",sv:"Att skriva ett likvärdigt bråk i enklaste form."},
    wrong:[
      {en:"To make the numerator and denominator larger.",sv:"Att göra täljaren och nämnaren större."},
      {en:"To change the fraction into a decimal.",sv:"Att ändra bråket till ett decimaltal."},
      {en:"To give two fractions the same denominator.",sv:"Att ge två bråk samma nämnare."}
    ]
  },
  {
    en:"What is the least common denominator (LCD)?",
    sv:"Vad är minsta gemensamma nämnare (MGN)?",
    correct:{en:"The smallest number that can be used as a common denominator for two or more fractions.",sv:"Det minsta tal som kan användas som gemensam nämnare för två eller flera bråk."},
    wrong:[
      {en:"The smallest denominator already shown in the fractions.",sv:"Den minsta nämnaren som redan finns i bråken."},
      {en:"The greatest number that divides all of the denominators evenly.",sv:"Det största tal som alla nämnarna kan delas jämnt med."},
      {en:"The number you get by adding the denominators together.",sv:"Talet du får när du adderar nämnarna."}
    ]
  },
  {
    en:"What does it mean to expand a fraction?",
    sv:"Vad innebär det att förlänga ett bråk?",
    correct:{en:"Multiply the numerator and denominator by the same number.",sv:"Multiplicera täljaren och nämnaren med samma tal."},
    wrong:[
      {en:"Add the same number to the numerator and denominator.",sv:"Addera samma tal till täljaren och nämnaren."},
      {en:"Multiply only the numerator by a number.",sv:"Multiplicera bara täljaren med ett tal."},
      {en:"Divide the numerator and denominator by the same number.",sv:"Dividera täljaren och nämnaren med samma tal."}
    ]
  },
  {
    en:"What does it mean to reduce a fraction?",
    sv:"Vad innebär det att förkorta ett bråk?",
    correct:{en:"Divide the numerator and denominator by the same common factor.",sv:"Dividera täljaren och nämnaren med samma gemensamma faktor."},
    wrong:[
      {en:"Subtract the same number from the numerator and denominator.",sv:"Subtrahera samma tal från täljaren och nämnaren."},
      {en:"Divide only the denominator by a number.",sv:"Dividera bara nämnaren med ett tal."},
      {en:"Multiply the numerator and denominator by the same number.",sv:"Multiplicera täljaren och nämnaren med samma tal."}
    ]
  },
  {
    en:"What happens to the value of a fraction when you expand or reduce it correctly?",
    sv:"Vad händer med bråkets värde när du förlänger eller förkortar det korrekt?",
    correct:{en:"The value stays the same.",sv:"Värdet är oförändrat."},
    wrong:[
      {en:"The value always becomes larger.",sv:"Värdet blir alltid större."},
      {en:"The value always becomes smaller.",sv:"Värdet blir alltid mindre."},
      {en:"The value always becomes a whole number.",sv:"Värdet blir alltid ett heltal."}
    ]
  },
  {
    en:"What does it mean for a fraction to be in simplest form?",
    sv:"Vad betyder det att ett bråk är skrivet i enklaste form?",
    correct:{en:"The numerator and denominator have no common factor greater than 1.",sv:"Täljaren och nämnaren har ingen gemensam faktor större än 1."},
    wrong:[

    wrong:[

  },
  {

    sv:"Vad betyder symbolen >?",
    correct:{en:"Greater than.",sv:"Större än."},
    wrong:[
      {en:"Less than.",sv:"Mindre än."},
      {en:"Equal to.",sv:"Lika med."},
      {en:"Approximately equal to.",sv:"Ungefär lika med."}
    ]
  },
  {
    en:"If you multiply both the numerator and denominator of a fraction by 3, what happens to the value of the fraction?",
    sv:"Om du multiplicerar både täljaren och nämnaren i ett bråk med 3, vad händer med bråkets värde?",
    correct:{en:"The value stays the same.",sv:"Värdet är oförändrat."},
    wrong:[
      {en:"The value becomes three times as large.",sv:"Värdet blir tre gånger så stort."},
      {en:"The value becomes three times as small.",sv:"Värdet blir en tredjedel så stort."},
      {en:"The fraction always becomes an improper fraction.",sv:"Bråket blir alltid ett oäkta bråk."}
    ]

  {

    sv:"Om två bråk har samma nämnare, hur avgör du vilket bråk som är störst?",
    correct:{en:"The fraction with the larger numerator is larger.",sv:"Bråket med den större täljaren är störst."},
    wrong:[
      {en:"The fraction with the smaller numerator is larger.",sv:"Bråket med den mindre täljaren är störst."},
      {en:"The fractions must always be equal.",sv:"Bråken måste alltid vara lika stora."},

const QUIZ_SIZE = 10;
const root = document.querySelector(".app");
const progressText = document.getElementById("progressText");
const progressPercent = document.getElementById("progressPercent");
const progressFill = document.getElementById("progressFill");
const completedStat = document.getElementById("completedStat");
const streakStat = document.getElementById("streakStat");
const wrongStat = document.getElementById("wrongStat");
const questionView = document.getElementById("questionView");
const questionBadge = document.getElementById("questionBadge");
const questionEn = document.getElementById("questionEn");
const questionSv = document.getElementById("questionSv");
const optionsEl = document.getElementById("options");
const feedback = document.getElementById("feedback");
const feedbackIcon = document.getElementById("feedbackIcon");
const feedbackCopy = document.getElementById("feedbackCopy");
const celebrationLayer = document.getElementById("celebrationLayer");
const completion = document.getElementById("completion");
const completionMessage = document.getElementById("completionMessage");
const resultCompleted = document.getElementById("resultCompleted");
const resultWrong = document.getElementById("resultWrong");
const resultStreak = document.getElementById("resultStreak");
const newRoundBtn = document.getElementById("newRoundBtn");
const playAgainBtn = document.getElementById("playAgainBtn");

let round = [];
let index = 0;
let wrongAttempts = 0;
let streak = 0;
let bestStreak = 0;
let locked = false;
let missedCurrent = false;
let advanceTimer = null;

function shuffle(items){
  const a = [...items];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
function setFeedback(kind,en,sv){
  feedback.className = `feedback ${kind} show`;
  feedbackIcon.textContent = kind === "good" ? "✓" : "×";
  feedbackCopy.innerHTML = `${escapeHtml(en)}<span class="feedback-sv" lang="sv">${escapeHtml(sv)}</span>`;
}
function clearFeedback(){
  feedback.className = "feedback";
  feedbackIcon.textContent = "";
  feedbackCopy.textContent = "";
}
function updateHud(){
  const total = round.length || QUIZ_SIZE;
  const completed = Math.min(index,total);
  const pct = total ? Math.round((completed/total)*100) : 0;
  progressText.textContent = index < total ? `Question ${index+1} of ${total}` : `${total} of ${total} completed`;
  progressPercent.textContent = `${pct}%`;
  progressFill.style.width = `${pct}%`;
  completedStat.textContent = completed;
  streakStat.textContent = streak;
  wrongStat.textContent = wrongAttempts;
}
function burst(){
  celebrationLayer.innerHTML = "";
  const vectors = [
    [-155,-80,-150],[-120,-118,-100],[-72,-138,-55],[-18,-150,-20],[42,-142,35],[98,-118,85],[148,-72,125],
    [-164,-16,-85],[-142,42,-55],[-92,88,-20],[-35,112,30],[28,116,75],[88,92,115],[145,45,150]
  ];
  vectors.forEach((v,i)=>{
    const s=document.createElement("span");
    s.className="spark";
    s.style.setProperty("--x",`${v[0]}px`);
    s.style.setProperty("--y",`${v[1]}px`);
    s.style.setProperty("--r",`${v[2]}deg`);
    s.style.width=`${6+(i%3)*2}px`;
    s.style.height=`${6+((i+1)%3)*2}px`;
    s.style.borderRadius=i%2 ? "50%" : "2px";
    if(i%3===1) s.style.background="#5f86e4";
    if(i%3===2) s.style.background="#8ab6ff";
    celebrationLayer.append(s);
  });
  setTimeout(()=>{celebrationLayer.innerHTML=""},850);
}
function renderQuestion(){
  if(index >= round.length){finishRound();return}
  locked=false;
  missedCurrent=false;
  clearFeedback();
  const item=round[index];
  questionBadge.textContent=`${index+1} / ${round.length}`;
  questionEn.textContent=item.en;
  questionSv.textContent=item.sv;
  optionsEl.innerHTML="";
  const choices=shuffle([
    {...item.correct,correct:true},
    ...item.wrong.map(answer=>({...answer,correct:false}))
  ]);
  const letters=["A","B","C","D"];
  choices.forEach((choice,i)=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="option";
    button.dataset.correct=choice.correct ? "true" : "false";
    button.innerHTML=`
      <span class="option-letter">${letters[i]}</span>
      <span class="option-copy">
        <span class="option-en">${escapeHtml(choice.en)}</span>
        <span class="option-sv" lang="sv">${escapeHtml(choice.sv)}</span>
      </span>`;
    button.addEventListener("click",()=>chooseAnswer(button));
    optionsEl.append(button);
  });
  updateHud();
}
function chooseAnswer(button){
  if(locked || button.disabled) return;
  if(button.dataset.correct === "true"){
    locked=true;
    button.classList.add("correct");
    optionsEl.querySelectorAll(".option").forEach(btn=>btn.disabled=true);
    if(missedCurrent){
      streak=0;
    }else{
      streak++;
      bestStreak=Math.max(bestStreak,streak);
    }
    setFeedback("good","Correct!","Rätt!");
    burst();
    updateHud();
    advanceTimer=setTimeout(()=>{
      advanceTimer=null;
      index++;
      renderQuestion();
    },1050);
  }else{
    wrongAttempts++;
    missedCurrent=true;
    streak=0;
    button.classList.add("wrong");
    button.disabled=true;
    setFeedback("bad","Try again.","Försök igen.");
    updateHud();
  }
}
function finishRound(){
  questionView.style.display="none";
  completion.classList.add("show");
  resultCompleted.textContent=round.length;
  resultWrong.textContent=wrongAttempts;
  resultStreak.textContent=bestStreak;
  if(wrongAttempts===0){
    completionMessage.textContent=`Perfect round — all ${round.length} questions completed with no wrong attempts.`;
    burst();
  }else{
    completionMessage.textContent=`You completed all ${round.length} questions with ${wrongAttempts} wrong ${wrongAttempts===1 ? "attempt" : "attempts"}.`;
  }
  index=round.length;
  updateHud();
}
function newRound(){
  if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null}
  round=shuffle(QUESTION_BANK).slice(0,Math.min(QUIZ_SIZE,QUESTION_BANK.length));
  index=0;
  wrongAttempts=0;
  streak=0;
  bestStreak=0;
  locked=false;
  missedCurrent=false;
  completion.classList.remove("show");
  questionView.style.display="block";
  renderQuestion();
}

newRoundBtn.addEventListener("click",newRound);
playAgainBtn.addEventListener("click",newRound);
root.addEventListener("keydown",e=>{
  if(e.target.matches("button")) return;
});
newRound();
</script>
</body>
</html>
